yaml
name:  Java CI with Ant

on:
 push:
  branches: ["main"]
pull_request:
  branches: ["main"]

jobs:
 build:
  runs-on: ubuntu-latest
  
  steps:
-name: checkout code
uses: actions/Checkout@v4

-name: Set up JDK 17
uses: actions/setup-java@v4
with:
  java-version: "17"
  distribution: "temurin"

-name: Set up Apache Ant
uses: fwilhemt/setup-ant@v1

-name: Run Ant tests
run: ant test


